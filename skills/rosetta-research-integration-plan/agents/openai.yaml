interface:
  display_name: "Rosetta Integration Planner"
  short_description: "Plan human-gated Rosetta integration proposals"
  default_prompt: "Use $rosetta-research-integration-plan to design and publish a fully groomed, source-grounded Rosetta experimental-integration issue behind the required human-admission label. Separate accepted authority, Core alignment, prototype verification, optional standards conformance, collaboration status, communication capture, and specification-pressure evidence."

dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "Inspect Rosetta sources and issues, check duplicates, and publish the integration issue"

policy:
  allow_implicit_invocation: true
