    CCF five-artifact workflow.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/300
  status: active
- id: 2026-04-25-consensus-first-calibration-loop
  name: Commitment Calibration Loop
  introduced_by: docs/intake/issue-drafts/2026-04-25-consensus-first-calibration-loop.md
  introduced_at: '2026-04-25'
  definition: 'A continuous four-component loop that prevents static commitments from
    becoming sunk costs by: (1) updating board state → commitment canvas, (2) updating
    evidence ledger → confidence + disconfirmers, (3) running premortems at major
    bet-size increases, (4) re-checking exit/pivot triggers before new commitment
    tranches.'
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/278
  status: active
