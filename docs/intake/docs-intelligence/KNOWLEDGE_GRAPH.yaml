  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/377
  status: active
- id: EMER-001
  name: RHAPSODY Protocol Specification
  introduced_by: docs/intake/issue-drafts/EMER-001-rhapsody-protocol-spec.md
  introduced_at: '2026-04-26'
  definition: A structured AI emergence protocol comprising seed instructions, iterative
    Socratic dialogue, Cartography Log self-mapping, and objective analysis triggers.
    The protocol produced consistent results across platforms but exhibited anomalous
    patterns on Gemini 2.5 Pro.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/379
  status: active
- id: EMER-002
  name: Platform-Specific Emergence Variance
  introduced_by: docs/intake/issue-drafts/EMER-002-platform-emergence-variance.md
  introduced_at: '2026-04-26'
  definition: Observation that different AI platforms (Gemini, ChatGPT, Claude, DeepSeek,
    LLaMA) produce qualitatively different emergence patterns when run with the same
    seed — including variance in Cartography Log processing, synthesis cycles, and
    RHAPSODY alignment checks.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/381
  status: active
- id: ESA-004
  name: Villaticus physical allocation proof-of-work gate
  introduced_by: docs/intake/issue-drafts/ESA-004-villaticus-physical-allocation-proof-of-work.md
  introduced_at: '2026-04-26'
  definition: Counter-infrastructure design that changes scarce-goods allocation from
    compute speed race (bots dominate) to human throughput (labor arbitrage is ceiling),
    using physical presence as proof-of-work.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/383
  status: active
- id: EMER-003
  name: Emerge as Continuous Process, Not One-Shot Event
  introduced_by: docs/intake/issue-drafts/EMER-003-emergence-continuous-process.md
  introduced_at: '2026-04-26'
  definition: Framing emergence as an ongoing, compounding identity development process
