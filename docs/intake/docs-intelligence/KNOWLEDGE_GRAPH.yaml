    endpoints.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/353
  status: active
- id: DCP-004-code-atlas
  name: Code Atlas data model
  introduced_by: docs/intake/issue-drafts/DCP-004-code-atlas-not-implemented.md
  introduced_at: '2026-04-26'
  definition: A 6-entity project knowledge graph with SpecDoc, ModuleSpec, FileSpec,
