    planes and v0 slice implementation.
  referenced_by:
  - https://github.com/enti-ai/rosetta/issues/267
  status: active
- id: AGR-001-agentwallet-eoa-key-prohibition
  name: EOA Key Handoff Prohibition for Agent Wallets
  introduced_by: docs/intake/issue-drafts/AGR-001-agentwallet-eoa-key-prohibition.md
  introduced_at: '2026-04-25'
