  definition: Reusable elicitation pattern where creative output (song parody) forces
    architectural articulation of AI self-model via structural constraints (meter,
    rhyme).
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/387
  status: active
- id: bip-001-1-crm-learning-feedback-loop
  name: CRM Learning Feedback Loop
  introduced_by: docs/intake/issue-drafts/BIP-001-1-crm-learning-feedback-loop.md
  introduced_at: '2026-04-26'
  definition: Mechanism by which user rejections of CRM contacts are communicated
    back to the learning system to update skip_domains and other exclusion lists.
    Currently underspecified in BIP-001.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/389
  status: active
- id: BIP-001-2-crm-exchange-count-formula
  name: 'BIP-001-2: Exchange Count Formula Misclassifies Automated Senders'
  introduced_by: docs/intake/issue-drafts/BIP-001-2-crm-exchange-count-formula.md
  introduced_at: '2026-04-26'
  definition: The BIP-001 exchange estimation formula Math.min(Math.floor(totalMessages/2),
    threadCount) conflates broadcast message volume with genuine two-way exchanges,
    inflating scores for automated senders.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/391
  status: active
- id: rosetta-v3-007-network-topology-assumptions
  name: Network Topology Assumptions Undeclared
  introduced_by: docs/intake/issue-drafts/rosetta-v3-007-network-topology-assumptions.md
  introduced_at: '2026-04-25'
  definition: The Rosetta v3.0.0 Core Spine Specification explicitly avoids prescribing
    network topology (supports single-node and p2p federated equally) but never declares
    which is the near-term default, causing potential implementation incompatibilities.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/84
  status: active
- id: BIP-001-3-crm-llm-prompt-missing
  name: BIP-001-3 LLM Classification Prompt Not Provided
  introduced_by: docs/intake/issue-drafts/BIP-001-3-crm-llm-prompt-missing.md
  introduced_at: '2026-04-26'
  definition: The LLM classification step for BIP-001 Stage 2 contact filtering lacks
    a provided prompt template, making behavior non-reproducible and non-auditable.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/394
  status: active
- id: BIP-002-1-kb-sentence-split-abbreviations
  name: Sentence Split Regex Fails on Common English Abbreviations
  introduced_by: docs/intake/issue-drafts/BIP-002-1-kb-sentence-split-abbreviations.md
  introduced_at: '2026-04-26'
  definition: The BIP-002 chunking regex (?<=[.!?])\s+ splits on all punctuation including
    abbreviation periods, corrupting chunk semantics for inputs like "Dr.", "e.g.",
    "Fig. 1".
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/396
  status: active
- id: BIP-002-2-kb-error-page-detection-narrow
  name: Error-Page Detection Signal Set Too Narrow
  introduced_by: docs/intake/issue-drafts/BIP-002-2-kb-error-page-detection-narrow.md
  introduced_at: '2026-04-26'
  definition: The BIP-002 KB RAG error-page detector uses a hardcoded 2+ signal threshold
    from 7 unweighted phrases, causing false rejections of real content and missing
    novel WAF error pages.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/398
  status: active
- id: BIP-002-3-kb-near-duplicate-detection-missing
  name: 'BIP-002-3: Near-Duplicate Detection Gap'
  introduced_by: docs/intake/issue-drafts/BIP-002-3-kb-near-duplicate-detection-missing.md
  introduced_at: '2026-04-26'
  definition: Content deduplication using SHA-256 handles exact duplicates but misses
    near-duplicates (A/B tested pages, geo-personalized, paywall variants, AMP vs
    canonical). A semantic dedup layer at embedding stage is needed.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/400
  status: active
- id: bip-002-4-lock-file-not-atomic
  name: 'BIP-002-4: Atomic Lock File Acquisition'
  introduced_by: docs/intake/issue-drafts/BIP-002-4-kb-lock-file-not-atomic.md
  introduced_at: '2026-04-26'
  definition: Knowledge Base ingestion uses non-atomic check-then-create lock acquisition,
    creating race conditions. Should use fcntl/flock/mkdir atomic primitives instead.
  extends:
  - bip-002-knowledge-base-rag
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/402
  status: active
- id: BIP-003-1-content-40pct-threshold-unvalidated
  name: 40% Content Similarity Threshold — Unvalidated
  introduced_by: docs/intake/issue-drafts/BIP-003-1-content-40pct-threshold-unvalidated.md
  introduced_at: '2026-04-26'
  definition: The 40% combined similarity score (semantic 0.7 + keyword 0.3) used
    as a hard gate in BIP-003 content idea deduplication is arbitrary and unvalidated
    against ground-truth duplicate/non-duplicate datasets.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/404
  status: active
- id: BIP-003-2
  name: Hybrid Score Weights (0.7/0.3) Unvalidated
  introduced_by: docs/intake/issue-drafts/BIP-003-2-content-hybrid-weights-unvalidated.md
  introduced_at: '2026-04-26'
  definition: Fixed dedupe weights (70% semantic, 30% keyword) in BIP-003 lack calibration
    methodology, embedding-model dependency acknowledgment, or cross-validation evidence.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/406
  status: active
- id: BIP-003-3-content-idea-id-collision
  name: BIP-003 Idea ID Collision Risk
  introduced_by: docs/intake/issue-drafts/BIP-003-3-content-idea-id-collision.md
  introduced_at: '2026-04-26'
  definition: The YYYY-MM-DD-NNN sequential counter for content idea IDs has no atomic
    generation, risking collisions under concurrent writes and hitting a 999/day ceiling.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/408
  status: active
- id: BIP-004-1
  name: Thread Expansion Recursion Depth Limit
  introduced_by: docs/intake/issue-drafts/BIP-004-1-social-thread-expansion-no-depth-limit.md
  introduced_at: '2026-04-26'
  definition: BIP-004 social thread expansion lacks a maximum recursion depth, allowing
    unbounded API calls that can exhaust the API budget on deep or wide threads.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/410
  status: active
- id: BIP-004-2-social-engagement-ranking-not-normalized
  name: Social Engagement Ranking Without Follower Count Normalization
  introduced_by: docs/intake/issue-drafts/BIP-004-2-social-engagement-ranking-not-normalized.md
  introduced_at: '2026-04-26'
  definition: Social media research ranking uses raw engagement (likes+retweets+replies)
    without normalizing for follower count, biasing toward high-follower accounts
    and missing relative resonance signals.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/412
  status: active
- id: ccf-006-no-exit-pivot-trigger-formalization
  name: Exit/Pivot Trigger Formalization
  introduced_by: docs/intake/issue-drafts/ccf-006-no-exit-pivot-trigger-formalization.md
  introduced_at: '2026-04-26'
  definition: Tooling and monitoring layer for exit/pivot/continue/enter triggers
    in the Consensus-First Commitment Scoping Framework. Triggers require formal evaluation
    mechanisms (docs, board metadata, or automated alerting) beyond artifact format
    definition.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/290
  - https://github.com/entif-ai/rosetta/issues/278
  status: active
- id: bip-004-3-cache-key-unspecified
  name: 'BIP-004-3: Social Cache Key Unspecified'
  introduced_by: docs/intake/issue-drafts/BIP-004-3-social-cache-key-unspecified.md
  introduced_at: '2026-04-26'
  definition: BIP-004 Social Media Research System lacks a defined cache key scheme,
    risking cache misses and semantically identical query collisions.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/415
  status: active
- id: text-core-should-have-owners
  name: Text-Core Should-Have Ownership
  introduced_by: docs/intake/issue-drafts/text-core-should-have-owners.md
  introduced_at: '2026-04-26'
  definition: Assignment of implementation owners and sequencing notes for the five
    Should-Have items in the Text-Core MVP Scope Gate to prevent silent dropout or
    accidental Must-Have promotion.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/417
  status: active
- id: sld-006-skill-vetting-pipeline
  name: Skill Vetting/Ingestion Pipeline (SLD-006)
  introduced_by: docs/intake/issue-drafts/SLD-006-skill-vetting-pipeline.md
  introduced_at: '2026-04-26'
  definition: 6-stage gating pipeline (Ingest → Normalize → Static lint → Petri eval
    pack → Sign+store → Enable) that certifies skills before broker visibility.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/419
  status: active
- id: BIP-005-1-youtube-quota-exhaustion
  name: YouTube API Quota Exhaustion Risk
  introduced_by: docs/intake/issue-drafts/BIP-005-1-youtube-quota-exhaustion.md
  introduced_at: '2026-04-26'
  definition: YouTube Data API has a strict daily quota (10k units/day default). BIP-005
    instructs daily metric collection across own + competitor channels with no quota
    monitoring or backoff strategy, risking quota exhaustion within minutes.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/421
  status: active
- id: BIP-006-1-briefing-policy-weight-update-unspecified
  name: BIP-006 Policy Table Weight Update Mechanism
  introduced_by: docs/intake/issue-drafts/BIP-006-1-briefing-policy-weight-update-unspecified.md
  introduced_at: '2026-04-26'
  definition: The BIP-006 nightly briefing system uses weighted priority scoring but
    lacks a specified mechanism for collecting feedback and updating the weight values
    over time.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/423
  status: active
- id: semantic-audio-semantic-emotive-graph-integration
  name: Semantic-Emotive Graph Integration (Audio)
  introduced_by: docs/intake/issue-drafts/semantic-audio-semantic-emotive-graph-integration.md
  introduced_at: '2026-04-26'
  definition: Defines how audio-derived entities (stems, tonal features, affective
    arcs, speaker fingerprints) attach to the semantic lexeme graph, integrating audio
    cognition into the larger graph of meaning, correlation, and context.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/425
  status: active
- id: df-005-config-mtime-race-condition
  name: Config mtime reload race condition
  introduced_by: docs/intake/issue-drafts/df-005-config-mtime-race-condition.md
  introduced_at: '2026-04-26'
  definition: get_app_config() uses mtime-based cache invalidation with no file locking
    or atomic operations, allowing Gateway and LangGraph to diverge when config.yaml
    changes during concurrent reload.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/427
  status: active
- id: BIP-006-2-briefing-frontier-cost-unbounded
  name: Nightly Frontier Model Cost Is Unbounded
  introduced_by: docs/intake/issue-drafts/BIP-006-2-briefing-frontier-cost-unbounded.md
  introduced_at: '2026-04-26'
  definition: The nightly briefing system (BIP-006) has no per-run cost cap, no adaptive
    model fallback, no context window budget, and no integration with BIP-011 cost
    tracking. Parallel persona execution multiplies cost without bounds.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/429
  status: active
- id: BIP-006-3-signal-normalization
  name: BIP-006-3 Signal Normalization Layer
  introduced_by: docs/intake/issue-drafts/BIP-006-3-briefing-signal-normalization-unspecified.md
  introduced_at: '2026-04-26'
  definition: The BIP-006 nightly briefing spec normalizes heterogeneous signal sources
    into a standard schema but leaves the normalization transforms, confidence scoring
    methodology, direction comparison window, and source catalog unspecified.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/431
  status: active
- id: BIP-006-4-briefing-parallel-review-isolation
  name: Parallel Persona Review Isolation
  introduced_by: docs/intake/issue-drafts/BIP-006-4-briefing-parallel-review-isolation.md
  introduced_at: '2026-04-26'
  definition: Phase 2 of BIP-006 runs 4 personas in parallel via Promise.all, preventing
    each reviewer from seeing other reviewers outputs — limiting cross-review value
    and deliberative consensus.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/433
  status: active
- id: BIP-007-1-intent-classification
  name: BIP-007-1 Intent Classification Mechanism Not Specified
  introduced_by: docs/intake/issue-drafts/BIP-007-1-crm-nl-intent-classification-unspecified.md
  introduced_at: '2026-04-26'
  definition: BIP-007 defines five intent types (Lookup, Create, Update, List, Associate)
    but does not specify the classification mechanism — the core NLP task that maps
    user messages to intent types.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/435
  status: active
- id: BIP-008-1-humanize-wordlist-detection-fragile
  name: 'BIP-008-1: Word-list AI detection fragility'
  introduced_by: docs/intake/issue-drafts/BIP-008-1-humanize-wordlist-detection-fragile.md
  introduced_at: '2026-04-26'
  definition: Word-list based AI content detection (scanning for overuse of "delve",
    "landscape", "leverage", etc.) is trivially evaded by modern RLHF-trained LLMs
    and produces only binary flags without confidence scoring.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/437
  status: active
- id: APC-001-openai-no-shareable-cache-id
  name: OpenAI Prompt Caching Has No Shareable Cache ID Primitive
