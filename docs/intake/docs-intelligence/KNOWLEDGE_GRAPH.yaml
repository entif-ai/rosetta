  status: active
- id: DCP-008-coderag
  name: CodeRAG (Pattern Injection)
  introduced_by: docs/intake/issue-drafts/DCP-008-coderag-unimplemented.md
  introduced_at: '2026-04-26'
  definition: CodeRAG injects real patterns from existing repos into code generation
    to prevent hallucinated boilerplate, pulling patterns only when useful to fill
    underspecified implementation details.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/367
  status: active
- id: DCP-009-impact-analysis-not-gated
  name: Impact Analysis Gate
  introduced_by: docs/intake/issue-drafts/DCP-009-impact-analysis-not-gated.md
  introduced_at: '2026-04-26'
  definition: Pre-change gate that queries Code Atlas for module dependents and either
    blocks interface changes or schedules follow-up updates to prevent silent breakage.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/369
  status: active
- id: DCP-010
  name: Automation Ceiling Audit
  introduced_by: docs/intake/issue-drafts/DCP-010-automation-ceiling-audit-needed.md
  introduced_at: '2026-04-26'
  definition: Formal audit of existing project specs (VieDay, SAFE, Entif) to score
