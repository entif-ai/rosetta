  status: active
- id: EEH-002
  name: Adversarial Empathy Test Pack
  introduced_by: docs/intake/issue-drafts/EEH-002-adversarial-empathy-test-pack.md
  introduced_at: '2026-04-26'
  definition: Test pack for stress-testing HEART empathy axes under adversarial user
