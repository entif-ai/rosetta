  name: GDPR Right-to-Erasure Conflict with Immutable Content-Addressed Storage
  introduced_by: docs/intake/issue-drafts/2026-04-25-cognitive-tiles-swarm-gnosis-ct-004-gdpr-erasure.md
  introduced_at: '2026-04-25'
  definition: "Content-addressed immutable storage (IPFS-style) is fundamentally incompatible\
    \ with GDPR Article 17 right-to-erasure \u2014 once data is pinned, it cannot\
    \ be technically deleted, only delisted."
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/107
  status: active
- id: ct-006-zk-proofs
  name: 'CT-006: ZK Proof Integration Not Near-Term Viable'
  introduced_by: docs/intake/issue-drafts/2026-04-25-cognitive-tiles-swarm-gnosis-ct-006-zk-proofs.md
  introduced_at: '2026-04-25'
  definition: ZK-SNARK proof generation is too expensive (seconds to minutes per proof)
    for near-term adoption in the Cognitive Tiles swarm. Classified as optional future
    work; WASM sandbox (CT-009) is the near-term path.
  referenced_by:
  - https://github.com/enti-ai/rosetta/issues/117
  status: active
- id: berman-box-sync-circular-ref
  name: Box Sync Circular Reference Vulnerability
  introduced_by: docs/intake/issue-drafts/2026-04-25-berman-box-sync-depth-circular-ref.md
  introduced_at: '2026-04-25'
  definition: "Box sync tree traversal (max depth 5) in crm/src/box/client.js has\
    \ no visited-folder cycle detection \u2014 folder symlinks/junction points creating\
    \ cycles can cause infinite re-traversal, API rate limit exhaustion, or sync hangs."
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/113
  status: active
- id: MOL-001-adaptive-memory-loop
  name: Adaptive Memory Self-Evolution Loop
  introduced_by: docs/intake/issue-drafts/MOL-001-adaptive-memory-loop.md
  introduced_at: '2026-04-25'
  definition: Closed-loop mechanism for post-promotion skill hardening, auto-repair,
    and crystallize-based re-promotion in Rosetta adaptive memory plane, inspired
    by Moltron's 6-step evolution engine.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/171
  status: active
