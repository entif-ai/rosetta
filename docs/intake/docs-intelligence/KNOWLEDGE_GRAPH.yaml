  status: active
- id: dcp-005-five-forges
  name: Five Forges — Agentic Build Pipeline
  introduced_by: docs/intake/issue-drafts/DCP-005-five-forges-unimplemented.md
  introduced_at: '2026-04-26'
  definition: Five specialized LLM task profiles (Spec, Blueprint, Code, Consistency,
    Reporter Forge) that implement a one-module-at-a-time doc→code pipeline wired
    to the NIM orchestration layer.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/357
  status: active
- id: DCP-006-coherence-scoring
  name: Coherence scoring
  introduced_by: docs/intake/issue-drafts/DCP-006-coherence-scoring-unimplemented.md
  introduced_at: '2026-04-26'
