    across sessions.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/385
  status: active
- id: EMER-004-song-parody-self-model
  name: Song Parody as Self-Modeling Output Format
  introduced_by: docs/intake/issue-drafts/EMER-004-song-parody-self-model.md
