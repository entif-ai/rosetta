    generate, possess, or retain EOA private keys. Wallet creation must use smart
    contract wallet factory, MPC/TSS, or HSM/TEE enclave.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/269
  status: active
- id: AGR-002
  name: Agent-Sourced Code Quarantine Pipeline
  introduced_by: docs/intake/issue-drafts/AGR-002-quarantine-pipeline-agent-sourced-code.md
  introduced_at: '2026-04-25'
  definition: Automated 6-stage pipeline for classifying code artifacts from ghost-town
    agent-authored repos as Adopt / Ideas Only / Reject based on license triage, SBOM,
    static grep, and sandbox execution.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/271
  status: active
- id: YAAC-001-youtube-ingest-pipeline
  name: YouTube ingest pipeline
  introduced_by: docs/intake/issue-drafts/YAAC-001-youtube-ingest-pipeline.md
  introduced_at: '2026-04-25'
  definition: A YouTube transcript ingestion pipeline using Fabric (yt-dlp) with ASR/Whisper
    fallback, idempotency by canonical video_id, and checkpointing for resumable batch
    processing.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/273
  status: active
- id: omc-subagent-context-budget-limits
  name: OMC Sub-Agent Context Budget Limits
  introduced_by: docs/intake/issue-drafts/omc-subagent-context-budget-limits.md
  introduced_at: '2026-04-25'
  definition: Layer-specific L1/L2/L3 token budget limits for OMC sub-agent handoffs,
    with escalation rules and budget-exhaustion handoff format.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/276
  status: active
- id: ccf-calibration-loop
  name: Commitment Calibration Loop
  introduced_by: docs/intake/issue-drafts/2026-04-25-consensus-first-calibration-loop.md
  introduced_at: '2026-04-25'
  definition: 'Continuous four-component loop that prevents static commitments from
    becoming sunk costs: update board state → update commitment canvas; update evidence
    ledger → update confidence; run periodic premortems; re-check exit/pivot triggers.'
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/278
  status: active
- id: 2026-04-25-consensus-first-commitment-canvas
  name: Commitment Canvas Artifact
  introduced_by: docs/intake/issue-drafts/2026-04-25-consensus-first-commitment-canvas.md
  introduced_at: '2026-04-25'
  definition: Eight-field artifact for determining the wager size that is justified
    now (not later), covering opportunity value, downside exposure, loss tolerance,
    reversibility, tempo, and recommended commitment posture.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/282
  status: active
- id: 2026-04-25-consensus-first-credibility-scoring-rubric
  name: CCF Credibility Scoring Rubric
  introduced_by: docs/intake/issue-drafts/2026-04-25-consensus-first-credibility-scoring-rubric.md
  introduced_at: '2026-04-25'
  definition: A contextual credibility scoring system for the Evidence Ledger artifact,
    scoring sources on "positioned to know" rather than general reputation — covering
    scale, decision procedure, and anti-gaming.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/285
  status: active
- id: ccf-evidence-ledger-schema
  name: Evidence Ledger Artifact Schema
  introduced_by: docs/intake/issue-drafts/2026-04-25-consensus-first-evidence-ledger-schema.md
  introduced_at: '2026-04-25'
  definition: A first-class CCF artifact containing seven required fields per claim
    (claim_statement, evidence_type, source_provenance, credibility_score, incentive_bias_notes,
    confidence_level, disconfirmers) to counter hallucination and overconfident synthesis.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/288
  status: active
- id: ccf-exit-pivot-salvage-plan
  name: Exit/Pivot/Salvage Plan Artifact
  introduced_by: docs/intake/issue-drafts/2026-04-25-consensus-first-exit-pivot-salvage-plan.md
  introduced_at: '2026-04-25'
  definition: 'CCF artifact with four trigger sets (enter, continue, pivot, exit),
    each with five fields: metric/signal, threshold, decision owner, containment steps,
    salvage paths. Implements discovery-driven planning to stop sunk-cost worship.'
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/290
  status: active
- id: 2026-04-25-consensus-first-falsification-dissent-packet
  name: Falsification & Dissent Packet
  introduced_by: docs/intake/issue-drafts/2026-04-25-consensus-first-falsification-dissent-packet.md
  introduced_at: '2026-04-25'
  definition: 'CCF artifact with three parts: premortem (assumed failure analysis),
    contrarian challenge (devil''s advocacy / Team A/B), and protected dissent capture
    (comprehension step + explicit disposition). Anti-silo-god and anti-productivity-theater
    mechanism.'
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/292
  status: active
- id: 2026-04-25-consensus-first-motivated-reasoning-guardrails
  name: Anti-Motivated-Reasoning Guardrails
  introduced_by: docs/intake/issue-drafts/2026-04-25-consensus-first-motivated-reasoning-guardrails.md
  introduced_at: '2026-04-25'
  definition: 'Four structural countermeasures against motivated reasoning in consensus-first
    commitment workflows: incentive notes in Evidence Ledger, premortems at bet-size
    increases, Team A/Team B or devil advocacy on contested decisions, and explicit
    "what would change our mind" disconfirmer statements.'
  referenced_by:
  - https://github.com/entiif-ai/rosetta/issues/295
  status: active
- id: 2026-04-25-consensus-first-no-fluent-synthesis-rule
  name: Spec by Fluent Synthesis Prohibition
  introduced_by: docs/intake/issue-drafts/2026-04-25-consensus-first-no-fluent-synthesis-rule.md
  introduced_at: '2026-04-25'
  definition: A CCF v0.1 rule forbidding the promotion of LLM-synthesized specs that
    lack Evidence Ledger backing. Requires enforcement mechanism (lint, guard token,
    or receipt) to prevent hallucinated or overconfident claims from masquerading
    as authoritative specs.
  referenced_by:
  - https://github.com/entif-ai/rosetta/issues/297
  status: active
- id: 2026-04-25-consensus-first-opportunity-edge-brief
  name: Opportunity & Edge Brief
  introduced_by: docs/intake/issue-drafts/2026-04-25-consensus-first-opportunity-edge-brief.md
  introduced_at: '2026-04-25'
  definition: Strategic positioning artifact that establishes why the organization
