  introduced_by: docs/intake/issue-drafts/DCP-002-orchestrator-core-not-built.md
  introduced_at: '2026-04-26'
  definition: The local Python service that coordinates all forges, manages the task
    queue, stores the project graph, and exposes CLI/API endpoints. Does not call
