    public_contract: creator_scorecard
    protected_authorities: [IPR-0009]
    relationship: implements
    protected_review_required_for:
      - weighting_changes
      - ranking_changes
      - calibration_changes
      - prediction_or_action_selection_changes

  - public_issue: 1475
