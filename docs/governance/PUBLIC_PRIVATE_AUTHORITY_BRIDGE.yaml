notes:
  - >-
    This initial bridge is intentionally incomplete. New edges MUST be added as
    public/private split work creates or discovers protected implementation authority.
  - >-
    Absence of an IPR edge is not proof that no protected requirement exists. Internal
    engineering still performs authority discovery for material behavioral changes.
