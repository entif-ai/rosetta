name: Entif site bootstrap

on:
  push:
    branches:
      - feat/entif-site-scaffold

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format site sources
        run: pnpm exec prettier --write "apps/entif-site/**/*.{astro,css,json,md,ts,tsx}" "docs/site/**/*.md"

      - name: Install Chromium
        run: pnpm --filter @entif-ai/site exec playwright install --with-deps chromium

      - name: Verify static site
        run: pnpm exec nx run entif-site:verify

      - name: Run browser feature tests
        id: e2e
        shell: bash
        run: |
          set +e
          pnpm exec nx run entif-site:e2e 2>&1 | tee apps/entif-site/e2e-debug.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Commit bootstrap output
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml apps/entif-site docs/site; then
            echo "Bootstrap files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/entif-site docs/site
          git commit -m "chore(site): capture bootstrap output"
          git push
