name: Entif site CI

on:
  pull_request:
    paths:
      - 'apps/entif-site/**'
      - 'docs/site/**'
      - 'eslint.config.mjs'
      - '.prettier*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/entif-site-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/entif-site/**'
      - 'docs/site/**'
      - 'eslint.config.mjs'
      - '.prettier*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/entif-site-ci.yml'

permissions:
  contents: read

concurrency:
  group: entif-site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @entif-ai/site exec playwright install --with-deps chromium

      - name: Verify static site
        run: pnpm exec nx run entif-site:verify

      - name: Run browser feature and accessibility tests
        run: pnpm exec nx run entif-site:e2e

      - name: Upload generated site preview
        uses: actions/upload-artifact@v4
        with:
          name: entif-site-preview
          path: apps/entif-site/dist
          if-no-files-found: error
          retention-days: 14
