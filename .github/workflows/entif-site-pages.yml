name: Preview Entif site on GitHub Pages

on:
  push:
    branches:
      - feat/entif-site-scaffold
    paths:
      - 'apps/entif-site/**'
      - 'docs/site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/entif-site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: entif-site-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ENTIF_SITE_URL: https://entif-ai.github.io
      ENTIF_SITE_BASE: /rosetta/previews/pr-1444
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview site
        run: pnpm exec nx run entif-site:build

      - name: Stage PR preview path
        run: |
          mkdir -p apps/entif-site/pages-preview/previews/pr-1444
          cp -R apps/entif-site/dist/. apps/entif-site/pages-preview/previews/pr-1444/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/entif-site/pages-preview

  deploy:
    environment:
      name: github-pages
      url: https://entif-ai.github.io/rosetta/previews/pr-1444/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
