name: Rosetta reviewed roadmap organization
on:
  push:
    branches: [audit/rosetta-roadmap-20260907]
    paths: [.github/workflows/rosetta-roadmap-organize.yml]
permissions:
  contents: write
  issues: write
concurrency:
  group: rosetta-roadmap-public-organization
  cancel-in-progress: false
jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Create public projections and apply reviewed scheduling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, datetime, hashlib, json, pathlib, time, urllib.error, urllib.parse, urllib.request
          REPO='entif-ai/rosetta'; API='https://api.github.com/'; BASE='docs/backlog/roadmap-20260907'
          H={'Authorization':'Bearer '+__import__('os').environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Rosetta-reviewed-roadmap'}
          OUT=pathlib.Path('roadmap-result');OUT.mkdir()
          result={'task':'rosetta-roadmap-20260907','started_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'successors':[],'labels':[],'skipped':[],'migration_cleanup_performed':False}
          frozen=set(map(int,'10,11,12,33,41,43,71,74,77,79,84,87,89,96,98,103,105,107,109,117,119,123,126,128,130,132,134,138,141,143,145,148,150,152,156,158,160,162,164,169,173,175,178,182,193,201,204,210,214,226,240,243,246,249,252,254,258,260,262,265,267,269,271,273,278,282,285,288,290,292,295,297,300,302,307,310,312,315,317,319,322,325,328,330,334,337,339,341,343,345,347,349,351,353,355,357,359,361,363,365,367,369,371,373,375,377,379,381,383,385,387,389,391,394,398,400,402,404,408,410,412,415,417,419,421,423,425,427,429,431,433,435,437,439,441,443,445,447,457,461,464,466,468,471,476,483,485,488,490,492,494,496,498,500,502,504,506,508,510,513,515,517,519,521,524,526,528,530,534,536,538,542,544,547,549,551,553,555,558,560,563,565,567,569,573,575,577,581,583,585,587,592,594,596,598,600,602,604,606,610,614,624,626,630,632,637,639,641,643,645,648,651,653,655,657,659,661,663,665,668,670,672,674,676,678,680,683,685,688,690,692,694,698,701,703,709,714,716,720,722,724,727,733,735,737,739,743,745,747,749,751,753,759,762,764,768,770,772,774,776,781,784,786,790,793,795,799,801,803,805,807,809,811,813,816,818,821,823,827,834,836,838,840,842,848,856,861,867,870,873,875,877,879,883,885,887,889,892,901,907,911,913,915,921,923,930,932,934,938,940,944,948,952,954,956,961,970,972,974,976,978,980,992,994,1017,1019,1021,1022,1024,1025,1026,1027,1028,1030,1031,1032,1033,1034,1035,1036,1038,1039,1044,1045,1046,1047,1048,1049,1051,1054,1056,1058,1059,1061,1062,1063,1065,1066,1068,1069,1070,1071,1072,1074,1075,1076,1077,1078,1081,1082,1083,1084,1085,1089,1090,1110,1111,1116,1118,1122,1123,1124,1125,1126,1127,1129,1130,1131,1134,1135,1136,1137,1138,1139,1140,1148,1150,1152,1153,1154,1155,1156,1159,1160,1167,1168,1169,1172,1173,1176,1177,1179,1180,1182,1183,1184,1185,1188,1189,1193,1194,1200,1205,1210,1211,1212,1213,1214,1215,1216,1217,1219,1220,1221,1222,1223,1224,1225,1226,1227,1228,1229,1230,1231,1233,1241,1249,1253,1295,1296,1300,1302,1303,1304,1306,1308,1386,1411,1420,1421,1422,1442,1443,1449,1457,1458,1459,1460,1461,1463,1464,1465,1466,1467,1468,1469,1470,1474,1475,1476,1477,1478,1479,1480,1481,1482,1483,1484,1485,1486,1488,1490,1491,1493,1495,1497,1500,1501,1502,1503,1504,1505,1506,1507,1508,1509,1510,1511,1512,1513,1514,1515,1516,1517,1518,1519,1520,1521'.split(',')))
          migrations=set(map(int,'119,126,128,130,132,134,138,169,254,260,351,355,357,359,365,367,369,371,379,383,385,389,391,394,398,400,404,408,412,423,429,433,435,437,441,447,461,464,468,476,485,490,492,494,500,502,517,524,530,534,567,648,655,657,659,663,665,670,672,692,694,698,739,743,751,753,786,803,818,821,827,834,838,867,944,954,970,972,974,976,1030,1124,1136,1182,1215,1226,1227,1228,1229,1230,1303,1306'.split(',')))
          waves={0:[158,676,1179,1200],1:[10,1180,680],2:[11,1194,790,1118,685],3:[1159,1028,934],4:[12,1160],5:[43,1205,907]}
          wave={n:s for s,ns in waves.items() for n in ns}
          p3=set(map(int,'84,87,96,105,107,109,141,148,193,243,249,258,265,307,312,317,319,322,330,381,387,427,466,498,515,551,553,555,592,594,596,598,600,602,604,606,610,614,632,688,690,737,745,747,749,762,764,768,770,772,774,784,811,813,816,952,980,1173,1184,1185,1216,1223,1231,1233,1249,1300,1302,1469,1470'.split(',')))
          p4={117,204,334};excluded={'private','docs-intake','gate:integration-planner-proposal'}
          # Public field contracts only. Mechanism construction is intentionally absent.
          groups={
          'contact-assessment':('Contact Assessment and Correction Record',[119,389,391,394,435,468],[158,210,506,1296],['assessment identity/version, source record and bounded sample references','subject/contact reference and unresolved-identity posture, without requiring cross-corpus identification','observed interaction features, units, provenance and missing-data flags','accepted/rejected/ambiguous/review-required outcome, reasons and policy reference','reviewer corrections, supersession and reversal references without rewriting prior evidence','authorization, retention, disclosure scope and receipt closure']),
          'source-quality':('Source Quality and Similarity Assessment Records',[398,400,404,437],[158,506,1056,1296],['bounded candidate and comparison-artifact references, original locators and content digests','distinct profiles for acquisition quality, document similarity, idea similarity and text-origin hypotheses','observed features, method/version reference, comparison scope and missing evidence','accepted/blocked/duplicate-candidate/distinct/clustered/revision/review/unknown disposition','calibration/profile reference and uncertainty without a required detector, coefficient or threshold','source spans, rights, correction and receipt closure; text-origin estimates do not establish authorship']),
          'ranking-evidence':('Ranking and Calibration Evidence Profile',[412,423,834],[158,1134,1061],['exact subject, candidate-set and evaluation-run references','criterion observations, units, missingness and declared rubric/profile version','observed result order and score-result references, distinct from truth and authorization','calibration/fixture references, context, uncertainty and comparability','feedback, corrections and append-only supersession','source, policy and receipt references without mandated ranking formulas']),
          'advisory-synthesis':('Advisory Review and Disagreement Trace Record',[134,433],[158,1130,1134],['review/run identity and evaluated proposal or artifact','reviewer role identifier and independent evidence references','supported, contested, missing and contradictory claims with uncertainty','accepted/rejected/merged/deferred/unresolved disposition, rationale and policy reference','final synthesis links to individual reviews rather than replacing them','budget, authorization and receipts; majority agreement does not establish correctness']),
          'codec-capability':('Codec Capability and Precision Requirement Profile',[476],[1184,143,158],['codec/provider profile identity, revision and supported media classes','requested compression and precision dimensions with units and measurement profile','declared capability versus measured results and certified fixture coverage','compatibility outcome and unmet requirements, without a provider-selection algorithm','resolver/passport/witness and fallback representation references','rights, provenance, policy and receipts']),
          'decode-decision':('Slug Decode Candidate and Decision Record',[260,751],[1184,158,1495,1490],['query/task and bounded retrieval-candidate identities','SlugURI, passport, witness, resolver status, fallback and rights references','observed candidate order, declared utility/cost/uncertainty and measurement profile','decode/skipped/verification-failed/rights-denied/fallback/budget-deferred outcome','decode attempt, source grounding and budget-result references','receipt closure and explicit unknown/failure states; no mandated ranking or expected-free-energy formula']),
          'scheduler-decision':('Scheduled Work Decision and Trigger Evidence Record',[517],[158,1051,1495,1295],['work/request identity and source-event or trigger observation','schedule/trigger profile and observed time without prescribing thresholds','fire/defer/degrade/skip/denied/halted decision and reasons','budget, authority, freshness and safe-hold evidence','resulting work handle, checkpoint and receipts','idempotent decision identity and supersession; scheduling evidence is not execution authority']),
          'research-intake':('Research Intake Assessment and Routing Record',[530,534],[158,506,1211,1213],['intake/source identity and bounded source snapshots','typed relevance/quality observations, not an endorsed truth score','rubric version, missing evidence, uncertainty and comparability','archive/queue-for-ingest/escalate-for-review/defer/deny/unknown routing','target job/proposal references and separate authorization before publication or durable admission','reviewer correction, source spans, policy and receipt closure']),
          'embedding-artifact':('Embedding and Projection Artifact Manifest',[657,663,670,672,1226],[685,1028,661,158],['artifact identity, source vocabulary/graph/media snapshot and stable row/anchor IDs','vector shape, dimension, numeric encoding, coordinate/normalization convention and validity constraints','model/transform identity and version references without training or fitting instructions','projection source/target spaces, transform-artifact reference and compatibility limits','dataset/pair-set provenance, licensing, coverage, uncertainty and reconstruction/evaluation references','receipt and conformance links; geometric proximity is neither native semantic identity nor factual truth']),
          'disambiguation-evidence':('Disambiguation Evaluation and Prior Evidence Record',[659,665,1124,1227],[563,575,668,1125,1126,1134],['source span/form and lexical/concept/frame candidate IDs','criterion/prior observations, vocabulary versions and missingness','evaluator/profile and calibration-set references without coefficient requirements','hypothesis distribution, uncertainty, abstention and non-collapse posture','per-candidate supporting/counter evidence and observed score-result references','receipt, replayability and supersession links; scores do not silently establish truth or identity']),
          'skill-selection':('Skill Selection and Preload Decision Record',[441,461,648,655],[173,175,419,1061,1139],['normalized need/request, scope and required capabilities','bounded shortlist with exact pack/version/export/profile and SkillCard references','fitness, certification and freshness evidence distinct from selection policy','use/extend/author-candidate/defer/deny/preload/unload decision, rationale and uncertainty','selected artifact or change proposal; preload visibility grants no execution authority','policy, budget, receipt closure and append-only selection changes']),
          'source-trust':('Source Trust Assessment Record',[803],[506,158,1056],['source/profile/record/manifestation subject and assessment version','trust dimensions with units or ordinal values and explicit unknowns','fixture-declared versus evidence-derived origin and evaluator/profile references','observation/effective times, freshness/decay-result metadata and comparability','source evidence, correction, supersession and uncertainty without required scoring or decay algorithms','rights, policy and receipts; trust posture is not proof of truth or write authority']),
          'graph-query':('Graph Query Plan and Cache Posture Record',[827],[158,1490,1036],['query identity, typed source/target references and bounded graph snapshot','declared join-strategy vocabulary and externally observable selected plan','scope, rights, bindings and unsupported/partial-plan states','cache identity, observed validity window, invalidation and freshness evidence','execution/result and comparison references without selection strategy or TTL tuning','receipts, refusal and supersession']),
          'analysis-admission':('Analysis Admission Evaluation Record',[821],[158,1241,1495,994],['signal/request identity and target analysis/capability','value-of-information observations, units, uncertainty and measurement profile','policy revision and bounded supporting/counter evidence','proposed/admitted/deferred/denied/unknown outcome and reasons','budget/authorization and resulting work references; an estimate grants no authority','replayability, receipt closure and corrections']),
          'capability-transfer':('Capability Transferability Evaluation Profile',[867],[1241,1061,1134,158],['source capability and target domain/task/context IDs','analysis results and bounded feature observations','evaluator/rubric versions, uncertainty, missingness and applicability limits','transferability result and explanation distinct from deployment approval','cache/freshness and supersession appropriate to source/target snapshots','provenance, policy and receipt references']),
          'coherence-evidence':('Builder Coherence Evaluation Record',[359],[349,1134,158,240],['InterfaceSpec, implementation, test and build-artifact references','check identity, supported language/profile and per-check results','component metric observations, missing/unsupported evidence and overall verdict','versioned evaluator/rubric references without a mandatory coherence formula','reporter projection and source-span evidence','receipts and supersession; positive scores do not authorize self-modification']),
          'code-pattern':('Reusable Code Pattern Evidence Record',[367],[349,1493,158,1134],['pattern identity and exact repository/file/ref/source spans','purpose, interface, dependencies, applicability and license','extraction/curation provenance and uncertainty','retrieval-candidate relation and declared implementation need','considered/included/rejected/blocked disposition and evidence without retrieval or injection algorithms','receipt, freshness and supersession references']),
          'impact-evidence':('Planned Change Impact Evidence Record',[369],[349,1493,158,994],['change/Blueprint and affected module/interface/file IDs','source graph snapshot and typed direct-dependency evidence','direct-only versus transitive impact scope and coverage','safe/blocked/unknown/follow-up-required outcome and evidence','proposed dependent work, without automatic mutation authority','policy, receipt and supersession references']),
          'content-risk':('Content Risk Assessment Vector and Disposition Record',[485,1182],[471,483,488,1183,158],['bounded content/source identity and ingress provenance','risk dimensions and detector/evaluator identities, versions and evidence','per-dimension observations, disagreement, unknowns and uncertainty','combination/policy profile reference without weights or ensemble implementation','allow/review/quarantine/deny/unknown disposition; permissions are separately authorized','source spans, disclosure scope, challenge path and receipt closure']),
          'entity-resolution':('Entity Resolution Proposal and Reversal Record',[838],[210,506,573,1296,158],['candidate entity/record IDs and bounded source evidence','proposed same-entity/distinct-entity/unresolved/review relation','supporting/conflicting evidence, confidence/profile and identity-sensitive classification','explicit approved association or refusal with authority, never implicit identity collapse','reversible association event, supersession and correction','privacy, retention, source spans and receipt closure']),
          'exploration-trace':('Bounded Exploration Branch and Outcome Record',[1136],[1129,1130,1134,1483,158],['exploration run, objective, input/context references and declared budget','branch identity, parent, candidate artifact and provenance','observed selection/rejection/abstention, reasons and uncertainty','novelty/evaluation observations without generation or sampling algorithms','actual resource use and termination/fallback outcomes','policy, receipts and append-only branch lineage']),
          'dialogue-study':('Dialogue Study Run and Evidence Manifest',[379],[915,956,158,1510],['study/protocol identity, version and disclosed step-profile reference','seed/context package identities, digests, availability, license and disclosure posture','provider/model/surface, supported settings and capture method','stage/transition observations, transcripts and reviewer-visible artifacts','completed/partial/anomalous/inconclusive/failed/unavailable-for-replication outcome','typed trace visibility, uncertainty and provenance; behavioral traces do not prove hidden state or consciousness'])}
          def req(method,path,data=None):
              assert path=='graphql' or path.startswith('repos/'+REPO+'/')
              if method!='GET':time.sleep(1.15)
              r=urllib.request.Request(API+path,headers=H,method=method,data=json.dumps(data).encode() if data is not None else None)
              if data is not None:r.add_header('Content-Type','application/json')
              with urllib.request.urlopen(r,timeout=90) as h:
                  raw=h.read();return json.loads(raw) if raw else None
          def get(path):return req('GET','repos/'+REPO+'/'+path)
          def pages(path):
              out=[]
              for p in range(1,101):
                  x=get(path+('&' if '?' in path else '?')+'per_page=100&page='+str(p));out.extend(x)
                  if len(x)<100:return out
              raise RuntimeError('Incomplete pagination')
          def write_file(path,text,message):
              payload={'message':message,'content':base64.b64encode(text.encode()).decode(),'branch':'main'}
              try:payload['sha']=get('contents/'+path)['sha']
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              obj=req('PUT','repos/'+REPO+'/contents/'+path,payload)
              reread=get('contents/'+path)
              assert base64.b64decode(reread['content']).decode()==text
              return obj['commit']['sha']
          try:
              assert len(frozen)==518 and len(migrations)==92 and len(groups)==22
              labels={x['name']:x for x in pages('labels')}
              if 'backlog' not in labels:
                  req('POST','repos/'+REPO+'/labels',{'name':'backlog','color':'eeeeee','description':'No committed execution wave. Requires an explicit consumer, prerequisite closure and bounded leaf before admission.'})
                  labels={x['name']:x for x in pages('labels')}
              all_open=[x for x in pages('issues?state=open&sort=created&direction=asc') if 'pull_request' not in x]
              for key,(title,sources,deps,fields) in groups.items():
                  marker='<!-- roadmap-public:'+key+' -->'
                  prior=next((i for i in all_open if marker in (i.get('body') or '')),None)
                  body=marker+'\n\n## Purpose and placement\n\nDefine the public '+title+' as an auxiliary Rosetta Pack/Profile contract. This is a schema-and-fixture work item, not implementation of the mechanism that produces the record. It is backlog work and is not a Text-Core Green prerequisite.\n\n'
                  body+='## Core descent and scope\n\nUse ROCK-3001/3002 identity, observation/evaluation, provenance and non-collapse semantics; package through ROCK-3003/3004 as applicable and validate through ROCK-3005/3010. Reuse existing envelope, evaluation and receipt families. The record name is provisional: #676 assigns any document/pack identifier, and #1179/#1180 review core descent. No new ROCK number or core tile kind is assigned here.\n\n'
                  body+='## Required representational surface\n\n'+''.join('- '+f[0].upper()+f[1:]+'.\n' for f in fields)+'\n'
                  body+='## Bounded engineering deliverable\n\nSelect one explicit public schema/export, document field types and optionality, define stable identity and version semantics, and provide one synthetic positive fixture plus negative/unknown and correction fixtures. Reference upstream artifacts rather than copying their authority fields. A fixture or declaration is not a production-capability claim.\n\n'
                  body+='## Acceptance criteria\n\n- [ ] Every surface above maps to a typed field, reference, or named profile with documented units and missingness.\n- [ ] A valid synthetic record round-trips without losing identity, uncertainty, scope or evidence.\n- [ ] Missing required identity/evidence, incompatible versions and unsupported claims fail visibly.\n- [ ] Unknown evidence is not coerced into a pass, a zero measurement or verified truth.\n- [ ] Correction/supersession preserves prior records and receipt lineage.\n- [ ] Public schema and fixtures can be understood and validated without protected implementation access.\n- [ ] Profile requirements state where #994 write admission, #1295 safe-hold and #1296 identity-sensitive authorization apply; ordinary read-only specification work is not blanket-blocked by them.\n- [ ] The export is explicitly admitted through the public schema/pack boundary rather than exposing an entire implementation catalog.\n\n'
                  body+='## Dependencies and non-goals\n\nConsume '+', '.join('#'+str(n) for n in deps)+'. Resolve the smallest relevant contract seam before the first fixture; coordination links are not universal hard blockers.\n\nDo not prescribe selection algorithms, training/fitting procedures, prompts, learned weights, private thresholds, production rollout or optimization. Do not reinterpret a recorded result as authorization or truth. Do not duplicate base receipts or widen the core to implement this domain.\n\n'
                  body+='## Source continuity\n\nPublic representational successor for historical source issue(s) '+', '.join('#'+str(n) for n in sources)+'. Original source preservation and protected-authority edges are tracked separately before source cleanup. The historical mechanism text is not normative public schema content.\n'
                  if prior:obj=prior
                  else:obj=req('POST','repos/'+REPO+'/issues',{'title':title+' (public Pack/Profile contract)','body':body,'labels':['documentation','planning','priority:p2','size:m','backlog']})
                  check=get('issues/'+str(obj['number']));assert marker in check['body']
                  if not prior:assert check['body']==body
                  result['successors'].append({'group':key,'number':obj['number'],'url':obj['html_url'],'sources':sources,'title':title,'verified':True})
              targets=[]
              for i in all_open:
                  n=i['number'];old=[x['name'] for x in i['labels']]
                  if n not in frozen or n in migrations or excluded.intersection(old):continue
                  fresh=get('issues/'+str(n));before=[x['name'] for x in fresh['labels']]
                  if fresh['state']!='open' or excluded.intersection(before):result['skipped'].append({'number':n,'reason':'state_or_exclusion_changed'});continue
                  priority='priority:p1' if n in wave else 'priority:p4' if n in p4 else 'priority:p3' if n in p3 else 'priority:p2'
                  schedule='sprint:s'+str(wave[n]) if n in wave else 'backlog'
                  after=[x for x in before if not x.startswith(('priority:','sprint:')) and x!='backlog']+[priority,schedule]
                  targets.append((fresh,before,after))
              for start in range(0,len(targets),10):
                  chunk=targets[start:start+10];variables={};decl=[];fields=[]
                  for j,(i,before,after) in enumerate(chunk):
                      key='i'+str(j);decl.append('$'+key+':UpdateIssueInput!');variables[key]={'id':i['node_id'],'labelIds':[labels[x]['node_id'] for x in after]}
                      fields.append('m'+str(j)+':updateIssue(input:$'+key+'){issue{number labels(first:100){nodes{name}}}}')
                  response=req('POST','graphql',{'query':'mutation('+','.join(decl)+'){'+''.join(fields)+'}','variables':variables})
                  if response.get('errors'):raise RuntimeError(json.dumps(response['errors']))
                  for j,(i,before,after) in enumerate(chunk):
                      changed=response['data']['m'+str(j)]['issue'];assert changed['number']==i['number']
                      got=[x['name'] for x in changed['labels']['nodes']];assert set(got)==set(after)
                      result['labels'].append({'number':i['number'],'before':before,'after':got,'verified':True,'changed':set(before)!=set(got)})
              result['completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
              result['frozen_count']=len(frozen);result['scheduled_count']=len(wave);result['deferred_migrations']=sorted(migrations)
              text=json.dumps(result,indent=2)
              result['result_commit']=write_file(BASE+'/organization-results.json',text,'planning: record verified issue scheduling and public contract successors')
              note='# Rosetta protocol roadmap execution policy\n\nThis planning policy records the authorized roadmap organization, not a protocol release or implementation-complete claim. The frozen census contains 518 open issues and excludes closed issues plus private, docs-intake and gate:integration-planner-proposal.\n\n## Two-track order\n\nMinimum Text-Core proof: #158 -> #10 -> #11 -> #1194 -> #1159 -> #12 -> #1160 -> #43 / #1205. These are minimum contract/fixture seams, not a requirement to finish every umbrella.\n\nParallel companion-standard work: #676 DocIDs; #1179 -> #1180 core-descent/catalog classification; #680 public schema allowlist; #790 and #1118 pack gates; #685 -> #1028 vocabulary proof; #934 -> #907 version/profile declarations. #1200 is read-only inspection support and does not block Text-Core.\n\n## Label meaning\n\nP1 is the selected proof or parallel foundation queue. P2 is a coherent supporting contract or next auxiliary profile. P3 is a later bounded research/conditional implementation decision. P4 is reference/watch work. Every retained issue receives exactly one priority and exactly one sprint wave OR backlog. S0-S5 are ordinal dependency waves, not dates or capacity commitments. A P1 label does not certify immediate execution readiness.\n\n'+''.join('- S'+str(k)+': '+', '.join('#'+str(n) for n in ns)+'\n' for k,ns in waves.items())+'\n## Admission and authority\n\nBacklog work re-enters only when a concrete consumer, stable public contract, bounded leaf and verifiable fixtures exist. Preserve uncertainty and provenance. Public schema/record/profile work stays public even when protected implementation consumes it. Operation-scoped write, halt and identity gates apply where relevant, not to every read-only draft. Historical sprint statements in issue prose are prior planning observations; the verified labels and this dated policy are the current planning projection.\n\nCurrent checked-in pack roots are draft RRP, Source Substrate and Source Taxonomy. A named proposed pack is not an implemented or conformant pack. No full Light/Full/Auditor/Forge certification is claimed.\n\nThe source-cleanup phase is separately preservation-gated. This organization result does not claim that cleanup has occurred. See organization-results.json for exact verified label changes and public successors.\n'
              result['policy_commit']=write_file(BASE+'/README.md',note,'planning: publish bounded two-track execution order and backlog admission rules')
              print('Verified public successors:',len(result['successors']));print('Verified retained issue label sets:',len(result['labels']))
          except Exception as e:
              result['error']=type(e).__name__+': '+str(e);raise
          finally:(OUT/'organization-results.json').write_text(json.dumps(result,indent=2))
          PY
      - name: Preserve public operation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rosetta-roadmap-organization
          path: roadmap-result/
          retention-days: 30
          if-no-files-found: error
