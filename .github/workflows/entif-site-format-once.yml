name: Format Entif site once

on:
  push:
    branches:
      - feat/entif-site-scaffold
    paths:
      - '.github/workflows/entif-site-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/entif-site-scaffold

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format site
        run: pnpm exec prettier --write "apps/entif-site/**/*.{astro,css,json,md,ts,tsx}"

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/entif-site
          git commit -m "style(site): apply repository formatting"
          git push origin HEAD:feat/entif-site-scaffold
